<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <!-- Accent shape -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#grad)" filter="url(#shadow)" />
  <!-- Inner graphic (Project Board representation) -->
  <rect x="144" y="160" width="100" height="40" rx="8" fill="#ffffff" opacity="0.9" />
  <rect x="144" y="220" width="100" height="130" rx="8" fill="#ffffff" opacity="0.6" />
  <rect x="268" y="160" width="100" height="100" rx="8" fill="#ffffff" opacity="0.6" />
  <rect x="268" y="280" width="100" height="70" rx="8" fill="#ffffff" opacity="0.9" />
</svg>
